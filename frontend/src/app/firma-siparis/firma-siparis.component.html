<p-toast />

<main class="p-4">
  <h2>Siparis Ekranı</h2>

  <p-table [value]="siparis" [tableStyle]="{ 'min-width': '50rem' }" class="mt-3">
    <ng-template pTemplate="header">
      <tr>
        <th>id</th>
        <th>Ürün</th>
        <th>Adet</th>
        <th> </th>
        <th> </th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-siparis>
      <tr>
        <td>{{ siparis[0] }}</td>
        <td>{{ siparis[1] }}</td>
        <td>{{ siparis[2] }}</td>
        <td>
          <p-button icon="pi pi-check" severity="success" [text]="true" [rounded]="true" (click)="siparisOnayla(siparis[0])" />
          <p-button icon="pi pi-trash" severity="danger" [text]="true" [rounded]="true" (click)="siparisReddet(siparis[0])" />
        </td>
      </tr>
    </ng-template>
  </p-table>
