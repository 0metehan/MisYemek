<p-toast />
<p-confirmPopup />

<div class="flex gap-3 mt-3 align-items-start">

  <aside class="w-22rem flex-shrink-0 text-center sticky top-4">
    <img src="assets/foto/images.jpg" alt="profil" class="block mx-auto w-14rem h-14rem border-circle shadow-2"
      style="object-fit: cover">

    <div class="mt-3 text-xl font-bold">{{ firma?.firmaAd }}</div>
    <div class="mt-2 text-color-secondary">{{ firma?.firmaTelNo }}</div>
    <div class="mt-1 text-color-secondary">
      {{ firma?.adres?.mahalle }} / {{ firma?.adres?.ilce }} / {{ firma?.adres?.sehir }}
    </div>

  </aside>

  <div class="flex flex-column gap-3 flex-1">

    <p-card header="Kullanıcı Adı">
      <p class="m-0 mb-3">{{ firma?.firmaAd }}</p>
      <p-inplace #inplaceAd>
        <ng-template pTemplate="display">
          <p-button label="Düzenle" icon="pi pi-pencil" severity="info" [text]="true" />
        </ng-template>
        <ng-template pTemplate="content">
          <div class="flex gap-2 align-items-center">
            <input type="text" [(ngModel)]="firma.firmaAd" pInputText />
            <p-button icon="pi pi-check" label="Kaydet" (click)="firmaGuncelle(); inplaceAd.deactivate()" />
            <p-button icon="pi pi-times" severity="secondary" [outlined]="true" (click)="inplaceAd.deactivate()" />
          </div>
        </ng-template>
      </p-inplace>
    </p-card>

    <p-card header="Telefon Numarası">
      <p class="m-0 mb-3">{{ firma?.firmaTelNo }}</p>
      <p-inplace #inplaceTel>
        <ng-template pTemplate="display">
          <p-button label="Düzenle" icon="pi pi-pencil" severity="info" [text]="true" />
        </ng-template>
        <ng-template pTemplate="content">
          <div class="flex gap-2 align-items-center">
            <input type="text" [(ngModel)]="firma.firmaTelNo" pInputText />
            <p-button icon="pi pi-check" label="Kaydet" (click)="firmaGuncelle(); inplaceTel.deactivate()" />
            <p-button icon="pi pi-times" severity="secondary" [outlined]="true" (click)="inplaceTel.deactivate()" />
          </div>
        </ng-template>
      </p-inplace>
    </p-card>

    <p-card header="Adres">
      <p class="m-0 mb-3">
        {{ firma?.adres?.mahalle }} / {{ firma?.adres?.ilce }} / {{ firma?.adres?.sehir }}
      </p>
      <p-inplace #inplaceAdres>
        <ng-template pTemplate="display">
          <p-button label="Düzenle" icon="pi pi-pencil" severity="info" [text]="true" />
        </ng-template>
        <ng-template pTemplate="content">
          <div class="flex flex-column gap-2">
            <input type="text" [(ngModel)]="firma.adres.mahalle" pInputText placeholder="Mahalle" />
            <input type="text" [(ngModel)]="firma.adres.ilce" pInputText placeholder="İlçe" />
            <input type="text" [(ngModel)]="firma.adres.sehir" pInputText placeholder="Şehir" />
            <div class="flex gap-2">
              <p-button icon="pi pi-check" label="Kaydet" (click)="firmaGuncelle(); inplaceAdres.deactivate()" />
              <p-button icon="pi pi-times" severity="secondary" [outlined]="true" (click)="inplaceAdres.deactivate()" />
            </div>
          </div>
        </ng-template>
      </p-inplace>
    </p-card>

  </div>

</div>
