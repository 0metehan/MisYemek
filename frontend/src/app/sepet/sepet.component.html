<p-toast />
<p-confirmPopup />

<main class="p-4">
  <h2>Sepet</h2>

  <p-table [value]="sepet" [tableStyle]="{ 'min-width': '50rem' }" class="mt-3">
    <ng-template pTemplate="header">
      <tr>
        <th>Firma</th>
        <th>Ürün</th>
        <th>Adet</th>
        <th>Total_Fiyat</th>
        <th> </th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-siparis>
      <tr>
        <td>{{ siparis.firmaUrun?.firma?.firmaAd }}</td>
        <td>{{ siparis.firmaUrun?.urunler?.urun }}</td>
        <td>{{ siparis.adet }}</td>
        <td>{{ siparis.firmaUrun?.fiyat * siparis.adet | number:'1.2-2' }} ₺</td>
        <td>
          <p-button icon="pi pi-trash" severity="danger" [text]="true" [rounded]="true" (click)="sepetSil(siparis.siparisId)" />
        </td>
      </tr>
    </ng-template>
  </p-table>

  <p-button label="Ödemeyi Tamamla {{ toplam | number:'1.2-2' }} ₺" icon="pi pi-credit-card" class="mt-3"
    [disabled]="sepet.length === 0" (click)="odemeYapOnay($event)" />
</main>
