<p-toast />
<p-confirmPopup />

<div class="flex gap-3 mt-3 align-items-start">

  <aside class="w-22rem flex-shrink-0 text-center sticky top-4">
    <img src="assets/foto/images.jpg" alt="profil" class="block mx-auto w-14rem h-14rem border-circle shadow-2"
      style="object-fit: cover">

    <div class="mt-3 text-xl font-bold">{{ hesap?.kullaniciAdi }}</div>
    <div class="mt-2 text-color-secondary">{{ hesap?.kullaniciTelNo }}</div>
    <div class="mt-1 text-color-secondary">
      {{ hesap?.adres?.mahalle }} / {{ hesap?.adres?.ilce }} / {{ hesap?.adres?.sehir }}
    </div>


  </aside>


  <div class="flex flex-column gap-3 flex-1">

    <p-card header="Kullanıcı Adı">
      <p class="m-0 mb-3">{{ hesap?.kullaniciAdi }}</p>
      <p-inplace #adInplace>
        <ng-template pTemplate="display">
          <p-button label="Düzenle" icon="pi pi-pencil" severity="info" [text]="true" />
        </ng-template>
        <ng-template pTemplate="content">
          <div class="flex gap-2 align-items-center">
            <input type="text" [(ngModel)]="hesap.kullaniciAdi" pInputText />
            <p-button icon="pi pi-check" label="Kaydet"
                      (click)="kullaniciGuncelleOnay($event); adInplace.deactivate()" />
            <p-button icon="pi pi-times" severity="danger" [text]="true"
                      (click)="adInplace.deactivate()" />
          </div>
        </ng-template>
      </p-inplace>
    </p-card>

    <p-card header="Telefon Numarası">
      <p class="m-0 mb-3">{{ hesap?.kullaniciTelNo }}</p>
      <p-inplace #inplaceTel>
        <ng-template pTemplate="display">
          <p-button label="Düzenle" icon="pi pi-pencil" severity="info" [text]="true" />
        </ng-template>
        <ng-template pTemplate="content">
          <div class="flex gap-2 align-items-center">
            <input type="text" [(ngModel)]="hesap.kullaniciTelNo" pInputText />
            <p-button icon="pi pi-check" label="Kaydet"
                      (click)="kullaniciGuncelleOnay($event); inplaceTel.deactivate()" />
            <p-button icon="pi pi-times" severity="danger" [text]="true"
                      (click)="inplaceTel.deactivate()" />
          </div>
        </ng-template>
      </p-inplace>
    </p-card>

    <p-card header="Adres">
      <p class="m-0 mb-3">
        {{ hesap?.adres?.mahalle }} / {{ hesap?.adres?.ilce }} / {{ hesap?.adres?.sehir }}
      </p>
      <p-inplace #adresInplace>
        <ng-template pTemplate="display">
          <p-button label="Düzenle" icon="pi pi-pencil" severity="info" [text]="true" />
        </ng-template>
        <ng-template pTemplate="content">
          <div class="flex flex-column gap-2" style="max-width: 20rem">
            <input type="text" [(ngModel)]="hesap.adres.mahalle" pInputText placeholder="Mahalle" />
            <input type="text" [(ngModel)]="hesap.adres.ilce" pInputText placeholder="İlçe" />
            <input type="text" [(ngModel)]="hesap.adres.sehir" pInputText placeholder="Şehir" />
            <div class="flex gap-2 align-items-center">
              <p-button icon="pi pi-check" label="Kaydet"
                        (click)="kullaniciGuncelleOnay($event); adresInplace.deactivate()" />
              <p-button icon="pi pi-times" severity="danger" [text]="true"
                        (click)="adresInplace.deactivate()" />
            </div>
          </div>
        </ng-template>
      </p-inplace>
    </p-card>

  </div>

</div>
