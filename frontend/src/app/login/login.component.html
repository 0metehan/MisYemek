<div class="flex align-items-center justify-content-center min-h-screen">
  <div class="flex flex-column gap-3">
    <div class="flex flex-column gap-2">
      <label class="font-bold" for="username">Kullanıcı Adı</label>
      <input pInputText id="username" type="text" [(ngModel)]="username" name="username" />
    </div>

    <div class="flex flex-column gap-2">
      <label class="font-bold" for="password">Şifre</label>
      <input pInputText id="password" type="password" [(ngModel)]="password" name="password" />
    </div>

    <p-button label="Login" icon="pi pi-user" (onClick)="login()" />

<p-button label="Kayıt Ol" icon="pi pi-user-plus" (onClick)="kullaniciEkle()" />

    <p>{{ message }}</p>
  </div>
</div>

<router-outlet></router-outlet>
