<p-toast />
<p-confirmPopup />

<div class="flex align-items-center gap-2 mb-3">
  <input type="text" pInputText placeholder="Ürün adı" [(ngModel)]="urunAdi" />

  <p-inputNumber [(ngModel)]="urunFiyat" mode="currency" currency="TRY" locale="tr-TR" placeholder="Fiyat"
    [style]="{ width: '10rem' }" />

  <p-button icon="pi pi-plus" label="Ekle" (onClick)="firmaUrunKaydet()" [disabled]="!urunAdi || !urunFiyat" />
</div>
<p-dataView [value]="urunler" [rows]="5" [paginator]="true">
  <ng-template pTemplate="list" let-liste>
    <div class="grid grid-nogutter">
      <div *ngFor="let item of liste; let first = first" class="col-12">
        <div class="flex align-items-center justify-content-between p-4 gap-3"
          [ngClass]="{ 'border-top-1 surface-border': !first }">

          <div class="flex align-items-center gap-3">
            <img
              src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRhEOJ_oIhhZQJJIFkRUznDulg-FaO1s6oFW7WvSBftiQ&s=10"
              alt="ürün" class="border-round" style="width: 5rem" />
            <div class="text-lg font-medium text-900">{{ item.urunler.urun }}</div>
          </div>

          <div class="flex align-items-center gap-3">
            <span class="text-xl font-semibold text-900">{{ item.fiyat }} ₺</span>

            <p-inplace #ip>
              <ng-template pTemplate="display">
                <p-button icon="pi pi-pencil" label="Fiyat Düzenle" [text]="true" />
              </ng-template>
              <ng-template pTemplate="content">
                <div class="flex gap-2 align-items-center">
                  <p-inputNumber [(ngModel)]="item.fiyat" mode="currency" currency="TRY" locale="tr-TR"
                    [style]="{ width: '8rem' }" />
                  <p-button icon="pi pi-check" severity="success"
                    (onClick)="secilenUrun = item; fiyatDuzenle(); ip.deactivate($event)" />
                  <p-button icon="pi pi-times" severity="danger" (onClick)="ip.deactivate($event)" />
                </div>
              </ng-template>
            </p-inplace>
            <p-button icon="pi pi-trash" severity="danger" [text]="true" (onClick)="urunSilOnay($event, item.id)" />
          </div>

        </div>
      </div>
    </div>
  </ng-template>
</p-dataView>
