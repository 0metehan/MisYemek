# Veritabanı URL'si (misyemek kısmına kendi oluşturduğunuz veritabanı adını yazın)
spring.datasource.url=jdbc:mysql://localhost:3306/misyemek?serverTimezone=UTC

# MySQL Kullanıcı Adınız (Genelde varsayılan olarak root'tur)
spring.datasource.username=root

# MySQL Şifreniz (Kendi şifrenizi yazın, şifre yoksa boş bırakın)
spring.datasource.password=root

# Spring Data JPA ve Hibernate Ayarları (Tabloları otomatik yönetmesi için)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jackson.time-zone=Europe/Istanbul
# JWT ayarlari
jwt.secret=${JWT_SECRET}
jwt.access-expiration=80000000
jwt.refresh-expiration=604800000